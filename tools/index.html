<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Redirecting to Vision Flow Studio…</title>
  <link rel="canonical" href="https://studio.visionflowgroup.com/tools/" />
  <meta http-equiv="refresh" content="0; url=https://studio.visionflowgroup.com/tools/" />
  <script>
    (function() {
      var subPath = window.location.pathname.replace(/^\/Studio\/?/i, '/');
      var target = 'https://studio.visionflowgroup.com' + (subPath.startsWith('/') ? subPath : '/' + subPath) + window.location.search + window.location.hash;
      window.location.replace(target);
    })();
  </script>
</head>
<body style="background:#0B1114;color:#F4F7F5;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">

</body>
</html>
